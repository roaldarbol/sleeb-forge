schema_version: 1

context:
  version: "1.20.0"

package:
  name: r-dir.expiry
  version: ${{ version }}

source:
  url:
    - https://bioconductor.org/packages/3.23/bioc/src/contrib/dir.expiry_${{ version }}.tar.gz
    - https://bioconductor.org/packages/release/bioc/src/contrib/dir.expiry_${{ version }}.tar.gz
  sha256: 895f0c8b9eb2c2eb2276ba69faec1c65947c2f9ec0b4811ae30e995353bc645c

build:
  number: 0
  noarch: generic
  script: R CMD INSTALL --no-multiarch --with-keep.source .

requirements:
  host:
    - r-base
    - r-filelock
  run:
    - r-base
    - r-filelock

tests:
  - script:
      - Rscript -e "library(dir.expiry)"

about:
  homepage: https://bioconductor.org/packages/dir.expiry
  summary: Managing Expiration for Cache Directories
  license: GPL-3.0-only
  repository: https://bioconductor.org/packages/dir.expiry

extra:
  recipe-maintainers:
    - roaldarbol
